name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Look up successful library tests
        id: library-tests
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pele-library-tests
          key: library-tests-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('src/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig*.json', 'vitest*.ts', '.github/workflows/ci.yml') }}
          lookup-only: true
      - name: Run full test suite
        if: steps.library-tests.outputs.cache-hit != 'true'
        run: |
          npm test -- --reporter=verbose
          mkdir -p "$RUNNER_TEMP/pele-library-tests"
          touch "$RUNNER_TEMP/pele-library-tests/passed"
      - run: npm run build

